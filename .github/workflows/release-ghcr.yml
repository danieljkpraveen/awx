name: Build & Publish AWX Release to GHCR

on:
  push:
    tags:
      - '20*'

permissions:
  contents: write
  packages: write

env:
  LC_ALL: 'C.UTF-8'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  release-awx:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set release variables
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LOWER=${OWNER_LOWER}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Ensure ansible-playbook is available
        run: |
          if ! command -v ansible-playbook >/dev/null 2>&1; then
            pip install --no-cache-dir ansible-core
          fi

      - name: Set up Node 18 for UI build
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Prebuild AWX UI from pinned fork tag
        run: make ui UI_GIT_BRANCH="${RELEASE_VERSION}"

      - name: Generate production Dockerfile
        run: make Dockerfile

      - name: Build and push multi-arch AWX image to GHCR
        id: build-awx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/awx:${{ env.RELEASE_VERSION }}
            ghcr.io/${{ env.OWNER_LOWER }}/awx:latest
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Snapshot awx-ee to GHCR under matching release tag
        run: |
          docker buildx imagetools create \
            quay.io/ansible/awx-ee:latest \
            --tag "ghcr.io/${OWNER_LOWER}/awx-ee:${RELEASE_VERSION}" \
            --tag "ghcr.io/${OWNER_LOWER}/awx-ee:latest"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat <<EOF > release_notes.md
          ## AWX Release \`${RELEASE_VERSION}\`

          Pinned production release built from \`${GITHUB_REPOSITORY}\` (\`${GITHUB_SHA}\`).

          ### Container Images (GHCR)
          - **AWX:** \`ghcr.io/${OWNER_LOWER}/awx:${RELEASE_VERSION}\` (digest: \`${{ steps.build-awx.outputs.digest }}\`)
          - **AWX EE (Control Plane):** \`ghcr.io/${OWNER_LOWER}/awx-ee:${RELEASE_VERSION}\`

          ### UI
          - Built from \`https://github.com/${OWNER_LOWER}/ansible-ui\` tag \`${RELEASE_VERSION}\`.
          EOF

          gh release create "${RELEASE_VERSION}" \
            --title "AWX ${RELEASE_VERSION}" \
            --notes-file release_notes.md \
            --latest
